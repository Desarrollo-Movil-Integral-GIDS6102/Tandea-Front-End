["5 oct","[DEVOPS-SETUP] Crear monorepo en GitHub (/backend, /app, /docs) y proteger main","Crear la organización y el repo tandea. En Settings → Branches, activar la regla de main: requerir PR, 1 aprobación y bloquear push directo. Crear /backend, /app y /docs con un README en cada una."],

["9 oct","[BE-AUTH] Crear guards de acceso por rol (usuario / admin_global)","JwtAuthGuard con JwtStrategy. Decorador @Roles() y RolesGuard con Reflector. Decorador @CurrentUser(). Organizador y participante se resuelven después con un TandaMemberGuard que consulta tanda.id_admin o number."],

"Cargar seed de tanda_type":"Seed con tipos: familiar, laboral, amigos. Prueba rápida: insertar dos number iguales en la misma vuelta y verificar el error P2002; en otra vuelta debe permitirse.",
"Probar unitariamente el cálculo":"Jest sobre calcularPlan: semanal, quincenal y mensual, con y sin número muerto, 1 y varias vueltas, valores límite. Replicar casos en flutter_test para el espejo de Dart.",

"Calcular automáticamente el total":"Función pura en domain: calcularPlan(periodicidad, monto, participantes, vueltas) que devuelve total de pagos, monto por vuelta y fecha de fin. Con número muerto, participantes + 1. Sin imports de NestJS.",
