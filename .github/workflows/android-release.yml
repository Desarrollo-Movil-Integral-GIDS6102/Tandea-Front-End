name: Android Release (Google Play)

on:
  push:
    branches:
      - dev
      - release

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Compilar AAB firmado y subir a Play Console
    runs-on: ubuntu-latest
    environment: PLAY_SERVICE_ACCOUNT_JSON

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Decodificar .env desde DOTENV_BASE64
        env:
          DOTENV_BASE64: ${{ secrets.DOTENV_BASE64 }}
        run: |
          if [ -z "$DOTENV_BASE64" ]; then
            echo "Error: el secreto DOTENV_BASE64 está vacío." >&2
            exit 1
          fi
          printf '%s' "$DOTENV_BASE64" | tr -d '\n\r ' | base64 -d > .env

      - name: Decodificar keystore desde KEYSTORE_BASE64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: el secreto KEYSTORE_BASE64 está vacío." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > android/app/upload-keystore.jks

      - name: Calcular versionCode incremental
        id: version
        run: |
          BASE_CODE=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          BASE_CODE=${BASE_CODE:-1}
          NEW_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "Usando versionCode=$NEW_CODE (base=$BASE_CODE + run_number=$GITHUB_RUN_NUMBER)"

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Compilar App Bundle (.aab) firmado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number="${{ steps.version.outputs.version_code }}"

      - name: Determinar pista de Google Play
        id: track
        run: |
          if [ "${{ github.ref_name }}" = "release" ]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "name=internal" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir .aab a Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: mx.tandea.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.track.outputs.name }}
          status: completed
